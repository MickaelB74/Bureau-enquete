# Blueprint Render.com — Site statique
# Déploiement : connectez ce dépôt sur https://dashboard.render.com → "New" → "Blueprint"
# Render lira ce fichier automatiquement.
services:
  - type: web
    name: bureau-enquete-numerique
    runtime: static
    # Aucune compilation nécessaire : ce sont des fichiers statiques (HTML/CSS/JS).
    buildCommand: ""
    # Dossier publié à la racine du site.
    staticPublishPath: ./public
    # Routage : la page enseignant d'abord, puis repli vers l'index.
    routes:
      # Page enseignant (corrigé complet) : /infos → /infos.html
      - type: rewrite
        source: /infos
        destination: /infos.html
      # Toute autre URL inconnue retombe sur l'index.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
